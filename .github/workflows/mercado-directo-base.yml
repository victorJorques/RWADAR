name: Mercado en directo (base)

# «La tokenización en el mundo» en directo (migración 35, 14/11/2026):
# Supabase pide a CoinGecko cada 5 minutos y la web y la app lo leen sin
# publicar nada. Este flujo aplica la 35 y sus scripts con las mismas
# garantías que «Avisos a registrados (base)»: solo desde main, cada SQL en
# su propia transacción, el verificador al final y solo acciones fijas. No
# se puede pasar un archivo cualquiera.
#
# Cada acción que cambia la base (o llama a CoinGecko desde ella) necesita
# orden expresa de la dirección (AGENTS.md) y escribir DIRECTO en «confirmar».
# «ensayo-35», «verificar-35», «ensayo-37», «verificar-37» y «estado» no
# cambian nada.
#
#   ensayo-35        la 35 y su verificador en una transacción que se deshace.
#   aplicar-35       con copia cifrada antes (35 días en los artefactos).
#   verificar-35     solo lee.
#   ensayo-37        la 37 (el arreglo del corte del 16/11: las altas de
#                    tokens ya no gastan la secuencia) y su verificador en
#                    una transacción que se deshace.
#   aplicar-37       con copia cifrada antes, como aplicar-35; después, los
#                    verificadores de la 35 y de la 37.
#   verificar-37     solo lee: los verificadores de la 35 y de la 37.
#   probar-coingecko con el directo apagado: UNA llamada a CoinGecko desde la
#                    red de Supabase (las mismas reglas de ranura y espera) y
#                    qué respondió (estado, bytes, 429); y la diaria publicada,
#                    como la leerá el reloj (sin un 200, falla: no encender).
#                    Repetirla 3-4 veces, espaciadas, antes de encender.
#   sembrar          la historia (unas 81 llamadas a CoinGecko desde GitHub,
#                    13 s entre ellas, unos 18 minutos). Tras un corte del
#                    directo de más de una hora, o para cambiar de lista.
#   encender         siembra y enciende en la misma ejecución (la 35 exige
#                    una siembra de menos de 30 minutos): crea los relojes
#                    rwadar-mercado-pedir y rwadar-mercado-leer.
#   apagar           quita los relojes; la web y la app vuelven al archivo
#                    publicado en 5 minutos como mucho, sin aviso. Guarda
#                    los datos.
#   deshacer         con copia antes: relojes, función pública y esquema.
#   estado           solo lee: relojes, llamadas, esperas, el documento y lo
#                    que sirve la web (/api/tokenizacion/directo).
#
# La copia cifrada va solo antes de aplicar-35, aplicar-37 y deshacer: las demás solo
# tocan rwadar_mercado (y sus dos relojes), que la copia de seguridad no
# guarda (se rehace con «sembrar»). Así no se gastan minutos de más.
#
# Usa los secretos de la copia de seguridad: SUPABASE_DB_URL y COPIA_CLAVE.
# Contrato: docs/tareas/MERCADO-DIRECTO-2026-11-14.md.

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        required: true
        type: choice
        options:
          - ensayo-35
          - verificar-35
          - aplicar-35
          - ensayo-37
          - verificar-37
          - aplicar-37
          - probar-coingecko
          - sembrar
          - encender
          - apagar
          - deshacer
          - estado
      confirmar:
        description: 'Escribe DIRECTO para las acciones que cambian la base o llaman a CoinGecko desde ella (no hace falta para ensayo-35, verificar-35, ensayo-37, verificar-37 ni estado)'
        required: false
        type: string

permissions:
  contents: read

# La misma cola que «Aplicar catálogo» y los avisos: nunca dos escrituras a la vez.
concurrency:
  group: rwadar-aplicar-catalogo
  cancel-in-progress: false

# Conexiones a Supabase siempre cifradas (lo comprueba .github/flujos.test.mjs).
env:
  PGSSLMODE: require

jobs:
  base:
    runs-on: ubuntu-24.04
    # La siembra tiene su propio límite (30); el resto, unos minutos.
    timeout-minutes: 40
    steps:
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "El directo solo se aplica desde main (se pidió desde ${GITHUB_REF})."
          exit 1

      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar la acción
        env:
          ACCION: ${{ inputs.accion }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          D=rwadar-app/db
          V35="$D/35_mercado_directo_verificar.sql"
          V37=""
          ENSAYO=no; COPIA=no; SIEMBRA=no; SQL=""
          case "$ACCION" in
            ensayo-35)        SQL="$D/35_mercado_directo.sql";          CAMBIA=no; ENSAYO=si ;;
            verificar-35)     SQL="$V35";                                CAMBIA=no ;;
            aplicar-35)       SQL="$D/35_mercado_directo.sql";          CAMBIA=si; COPIA=si ;;
            ensayo-37)        SQL="$D/37_mercado_directo_secuencia.sql"; V37="$D/37_mercado_directo_secuencia_verificar.sql"; CAMBIA=no; ENSAYO=si ;;
            verificar-37)     V37="$D/37_mercado_directo_secuencia_verificar.sql"; SQL="$V37"; CAMBIA=no ;;
            aplicar-37)       SQL="$D/37_mercado_directo_secuencia.sql"; V37="$D/37_mercado_directo_secuencia_verificar.sql"; CAMBIA=si; COPIA=si ;;
            probar-coingecko) CAMBIA=si ;;
            sembrar)          CAMBIA=si; SIEMBRA=si ;;
            encender)         SQL="$D/35_mercado_directo_encender.sql"; CAMBIA=si; SIEMBRA=si ;;
            apagar)           SQL="$D/35_mercado_directo_apagar.sql";   CAMBIA=si ;;
            deshacer)         SQL="$D/35_mercado_directo_deshacer.sql"; CAMBIA=si; COPIA=si ;;
            estado)           SQL="$D/35_mercado_directo_estado.sql";   CAMBIA=no ;;
            *) echo "Acción no válida: $ACCION"; exit 1 ;;
          esac
          if [ -n "$SQL" ]; then test -f "$SQL" || { echo "No existe $SQL"; exit 1; }; fi
          test -f "$V35" || { echo "No existe $V35"; exit 1; }
          if [ -n "$V37" ]; then test -f "$V37" || { echo "No existe $V37"; exit 1; }; fi
          if [ "$CAMBIA" = si ] && [ "$CONFIRMAR" != "DIRECTO" ]; then
            echo "Esta acción cambia la base o llama a CoinGecko desde ella: escribe DIRECTO en «confirmar»."; exit 1
          fi
          # Las dos copias de la 35 deben ser idénticas (la del CLI y la del SQL Editor).
          cmp -s "$D/35_mercado_directo.sql" rwadar-app/supabase/migrations/20261114090000_mercado_directo.sql \
            || { echo "Las dos copias de la 35 no coinciden"; exit 1; }
          # Y las de la 37 (el arreglo de la secuencia de tokens, 20/11/2026).
          cmp -s "$D/37_mercado_directo_secuencia.sql" rwadar-app/supabase/migrations/20261120180000_mercado_directo_secuencia.sql \
            || { echo "Las dos copias de la 37 no coinciden"; exit 1; }
          { echo "SQL=$SQL"; echo "CAMBIA=$CAMBIA"; echo "ENSAYO=$ENSAYO"; echo "COPIA=$COPIA"; echo "SIEMBRA=$SIEMBRA"; echo "V35=$V35"; echo "V37=$V37"; } >> "$GITHUB_ENV"

      - name: Instalar psql y pg_dump 17 (misma versión que Supabase)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Copia de seguridad antes de cambiar nada
        if: env.COPIA == 'si'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
        run: bash rwadar-app/copia-seguridad.sh copia-antes-directo

      - name: Guardar la copia 35 días
        if: env.COPIA == 'si'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copia-antes-directo-${{ inputs.accion }}-${{ github.run_number }}
          path: copia-antes-directo/
          retention-days: 35
          compression-level: 0
          if-no-files-found: error

      - name: Ensayo sin cambiar nada (se deshace al final)
        if: env.ENSAYO == 'si'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # La 35 (y la 37) es una sola transacción (begin; … commit;). Se
          # cambia su commit final por su verificador (sin su propia
          # transacción) y un rollback.
          VERIF="${V37:-$V35}"
          [ "$(grep -c '^commit;$' "$SQL")" = 1 ] && [ "$(tail -n 1 "$SQL")" = "commit;" ] \
            || { echo "$SQL no termina en un único commit;"; exit 1; }
          [ "$(grep -c '^begin transaction read only;$' "$VERIF")" = 1 ] && [ "$(tail -n 1 "$VERIF")" = "rollback;" ] \
            || { echo "El verificador $VERIF no tiene la forma esperada"; exit 1; }
          ENSAYO_SQL="$(mktemp)"
          head -n -1 "$SQL" > "$ENSAYO_SQL"
          grep -v '^begin transaction read only;$' "$VERIF" | head -n -1 >> "$ENSAYO_SQL"
          echo 'rollback;' >> "$ENSAYO_SQL"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$ENSAYO_SQL"
          echo "ENSAYO CORRECTO: $(basename "$SQL") y su verificador pasan en producción. No se ha cambiado nada (rollback)."

      - name: Preparar Node.js (solo sembrar y encender)
        if: env.SIEMBRA == 'si'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Parche de seguridad de Node del 21/10/2026. Sin npm: solo node.
          node-version: 22.23.4

      # La historia sale de CoinGecko (gratis, sin clave), nunca de la base,
      # y entra en una sola transacción (-1): o toda o nada.
      - name: Sembrar la historia (unos 18 minutos)
        if: env.SIEMBRA == 'si'
        timeout-minutes: 30
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          node rwadar-node-seguro.js
          node rwadar-app/tokenizacion/sembrar-directo.mjs > "$RUNNER_TEMP/siembra.sql"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -q -1 -f "$RUNNER_TEMP/siembra.sql" > /dev/null
          echo "Siembra guardada: $(grep -c '^select rwadar_mercado.sembrar(' "$RUNNER_TEMP/siembra.sql") tokens."

      - name: Aplicar
        if: env.CAMBIA == 'si' && env.SQL != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$SQL"

      # Una llamada (en su propia transacción: pg_net la manda al
      # confirmarse) y, unos segundos después, qué respondió. Solo números y
      # códigos: nada de la respuesta en sí.
      - name: Probar CoinGecko desde Supabase
        if: inputs.accion == 'probar-coingecko'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          PEDIDO="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select rwadar_mercado.probar_pedir()")"
          case "$PEDIDO" in
            pedido) ;;
            pronto|espera|pendiente) echo "No toca pedir todavía ($PEDIDO): como mucho una llamada cada 5 minutos. Vuelve a lanzarla en unos minutos."; exit 0 ;;
            encendido) echo "El directo está encendido: ya pide el reloj. Mira «estado»."; exit 0 ;;
            *) echo "Respuesta inesperada de la base al pedir."; exit 1 ;;
          esac
          RESULTADO=""
          for _ in $(seq 1 8); do
            sleep 5
            RESULTADO="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select rwadar_mercado.probar_leer()")"
            [[ "$RESULTADO" == *'"esperando"'* ]] || break
          done
          RE='^\{[^`$\\]*\}$'
          (( ${#RESULTADO} <= 600 )) && [[ "$RESULTADO" =~ $RE ]] || { echo "Respuesta inesperada de la base al leer."; exit 1; }
          echo "CoinGecko desde Supabase: $RESULTADO"
          { echo "### CoinGecko desde la red de Supabase"; echo; echo "\`$RESULTADO\`"; } >> "$GITHUB_STEP_SUMMARY"
          # La diaria publicada, como la leerá el reloj: sin un 200, no se enciende
          # (si no, a los 45 minutos de encender la web pasa a «atrasado» con aviso para todos).
          RE_DIARIA='"diaria": 200[,}]'
          if ! [[ "$RESULTADO" =~ $RE_DIARIA ]]; then
            echo "Supabase no pudo leer la diaria publicada (rwadar.pages.dev/datos/tokenizacion-serie.json): no enciendas hasta que la lea."
            { echo; echo "**Supabase no pudo leer la diaria publicada: no enciendas hasta que la lea.**"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Estado (solo lee)
        if: inputs.accion == 'estado'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$SQL"
          # Lo que sirve la web ahora (público, sin secretos).
          CODIGO="$(curl -sS -o "$RUNNER_TEMP/directo.json" -w '%{http_code}' --max-time 20 https://rwadar.pages.dev/api/tokenizacion/directo || echo 000)"
          echo "La web sirve /api/tokenizacion/directo con $CODIGO: $(head -c 300 "$RUNNER_TEMP/directo.json" 2>/dev/null | tr -cd '[:print:]')"

      - name: Comprobar que no queda nada (deshacer)
        if: inputs.accion == 'deshacer'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          QUEDA="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "select to_regnamespace('rwadar_mercado') is null and to_regprocedure('public.tokenizacion_directo()') is null and not exists (select 1 from cron.job where jobname like 'rwadar-mercado-%')")"
          [ "$QUEDA" = t ] || { echo "Queda algo del directo en la base."; exit 1; }
          echo "Deshecho: ni esquema, ni función pública, ni relojes del directo."

      - name: Verificar
        if: env.ENSAYO != 'si' && inputs.accion != 'deshacer'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$V35"
          if [ -n "${V37:-}" ]; then psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$V37"; fi
