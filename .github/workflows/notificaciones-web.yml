name: Notificaciones web

# Prueba de las notificaciones web (Web Push, migración 32,
# rwadar-app/db/32_notificaciones.sql) desde GitHub: «Prueba de RWAdar» a los
# navegadores de las cuentas de administración (perfiles.es_admin), es
# decir, solo los datos del propio Víctor. No necesita anuncio ni el push
# encendido. En el iPhone, solo con la web añadida a la pantalla de inicio
# (iOS 16.4 o posterior).
#
# Desde la migración 33 el envío de verdad (los anuncios, a quien tiene el
# permiso vigente) ya no pasa por aquí: lo hace Supabase en cada vuelta del
# reloj con el push encendido, pidiendo cada notificación al servidor de la
# web. Con la cuenta gratuita, GitHub no firma contrato de encargo y no debe
# ver las suscripciones de nadie más; por eso se retiró la acción «enviar» y
# «Avisar novedad» ya no llama a este flujo. La misma prueba por el camino de
# Supabase es la acción prueba-webpush de «Avisos a registrados (base)».
#
# Se lanza a mano escribiendo ENVIAR, siempre con orden expresa de Víctor
# (AGENTS.md). Nunca por horario ni desde otro flujo.
#
# Seguridad: sin npm. psql saca de la base los navegadores de prueba y la
# clave privada VAPID (Vault, RWADAR_VAPID_PRIVADA), que se enmascara en
# cuanto llega y solo pasa, por el entorno, al remitente
# (rwadar-app/enviar-webpush.mjs: node:crypto y fetch), que no recibe
# SUPABASE_DB_URL. Los envíos (endpoints y claves de cada navegador) van a
# una carpeta temporal que nunca se imprime y se borra al acabar. El resumen
# solo lleva cuentas.

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        required: true
        type: choice
        options:
          - prueba
        default: prueba
      confirmacion:
        description: 'Escribe ENVIAR'
        required: true
        type: string

# Ningún permiso por defecto. El trabajo solo necesita leer este repositorio
# privado para descargar el remitente y el SQL.
permissions: {}

# Conexiones a Supabase siempre cifradas: con el «prefer» de libpq (lo que usa
# psql si la dirección no lleva sslmode), alguien en medio que rechace TLS haría
# seguir sin cifrar. Una sola regla para todos los flujos que usan
# SUPABASE_DB_URL; la comprueba .github/flujos.test.mjs.
env:
  PGSSLMODE: require

jobs:
  prueba:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Una vuelta a la vez.
    concurrency:
      group: rwadar-notificaciones-web
      cancel-in-progress: false
    steps:
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Las notificaciones solo se envían desde main (se pidió desde ${GITHUB_REF})."
          exit 1

      - name: Comprobar la entrada
        env:
          ACCION: ${{ inputs.accion }}
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMACION" == "ENVIAR" ]] || { echo "Para enviar hay que escribir ENVIAR."; exit 1; }
          case "$ACCION" in
            prueba) echo "Entrada correcta: $ACCION." ;;
            *) echo "Acción no válida: solo prueba (el envío de verdad lo hace Supabase desde la migración 33)."; exit 1 ;;
          esac

      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: rwadar-app/db

      - name: Instalar psql 17 (misma versión que Supabase)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Parche de seguridad de Node del 21/10/2026. Sin npm: el remitente
          # solo usa node:crypto y fetch.
          node-version: 22.23.4

      # psql saca los navegadores de las cuentas de administración
      # (webpush_prueba), el remitente los cifra, firma y envía, y psql guarda
      # lo que respondió cada servicio (32_notificaciones_resultado.sql: solo
      # borra una suscripción caducada, 404/410).
      - name: Enviar
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ACCION: ${{ inputs.accion }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          node rwadar-node-seguro.js
          [ "$ACCION" = prueba ] || { echo "Acción no válida: solo prueba."; exit 1; }
          DIR="$RUNNER_TEMP/rwadar-webpush"
          rm -rf "$DIR"
          mkdir -m 700 "$DIR"
          consulta() { psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "$1"; }
          resumen() {
            {
              echo "### Notificaciones web (prueba)"
              echo
              for linea in "$@"; do echo "- $linea"; done
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Claves VAPID: la pública de la configuración y la privada de Vault,
          # enmascarada en cuanto llega. El remitente comprueba que casan.
          PUBLICA="$(consulta "select coalesce(webpush_clave_publica, '') from rwadar_novedades.configuracion where unica")"
          PRIVADA="$(consulta "select coalesce(max(decrypted_secret), '') from vault.decrypted_secrets where name = 'RWADAR_VAPID_PRIVADA'")"
          if [ -n "$PRIVADA" ]; then echo "::add-mask::$PRIVADA"; fi
          if ! [[ "$PUBLICA" =~ ^B[A-Za-z0-9_-]{86}$ && "$PRIVADA" =~ ^[A-Za-z0-9_-]{43}$ ]]; then
            echo "::error::Falta la clave VAPID: lanza «Avisos a registrados (base)» con crear-vapid."
            exit 1
          fi

          # El remitente recibe las claves por el entorno (export, sin pasar
          # por la línea de órdenes) y no recibe SUPABASE_DB_URL.
          consulta "select rwadar_novedades.webpush_prueba()" > "$DIR/lote.json"
          (
            unset SUPABASE_DB_URL
            export RWADAR_VAPID_PRIVADA="$PRIVADA" RWADAR_VAPID_PUBLICA="$PUBLICA"
            exec node rwadar-app/enviar-webpush.mjs --entrada "$DIR/lote.json" --salida "$DIR/resultados.json"
          )
          rm -f "$DIR/lote.json"
          if [ "$(cat "$DIR/resultados.json")" = "[]" ]; then
            echo "Ninguna cuenta de administración tiene la web suscrita: no sale nada."
            resumen "Ninguna cuenta de administración tiene la web suscrita: actívalas en Perfil desde el móvil."
            exit 0
          fi
          CUENTAS="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 \
            -v resultados="$(cat "$DIR/resultados.json")" \
            -f rwadar-app/db/32_notificaciones_resultado.sql)"
          IFS='|' read -r ENVIADOS REINTENTAR FALLIDOS BORRADAS IGNORADOS <<< "$CUENTAS"
          for n in "$ENVIADOS" "$REINTENTAR" "$FALLIDOS" "$BORRADAS" "$IGNORADOS"; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "Respuesta inesperada de la base al guardar los resultados."; exit 1; }
          done

          echo "Notificaciones web (prueba): $ENVIADOS enviada(s), $FALLIDOS fallida(s), $BORRADAS suscripción(es) caducada(s) borrada(s)."
          LINEAS=("Enviadas (aceptadas por el servicio de push): $ENVIADOS"
            "Fallidas: $FALLIDOS"
            "Suscripciones caducadas borradas: $BORRADAS")
          if [ "$IGNORADOS" != 0 ]; then LINEAS+=("Resultados ignorados: $IGNORADOS"); fi
          resumen "${LINEAS[@]}"

      - name: Borrar los envíos temporales
        if: always()
        run: rm -rf "$RUNNER_TEMP/rwadar-webpush"
