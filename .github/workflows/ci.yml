name: Verificación

# Solo en los PR (y a mano). Ya no corre otra vez al unir a main: lo que se une
# es lo mismo que acaba de pasar en el PR, y ningún otro flujo espera este
# resultado en main (07/11/2026, para ahorrar minutos de Actions).
#
# Si el PR solo cambia docs/** o archivos .md de la raíz, el escáner de
# secretos corre igual (un documento también puede llevar una clave pegada),
# pero la batería de pruebas se salta. Se salta con «if» y no con paths-ignore
# a propósito: un trabajo saltado cuenta como correcto, y así un PR de
# documentación nunca se queda con una comprobación «pendiente» si algún día se
# exige en las reglas de la rama. Las pruebas sí corren si alguno de esos
# documentos lo leen las pruebas o la compuerta de publicación (por ejemplo,
# AGENTS.md, docs/INTERNO.md o los informes que cita estado.json).
#
# Desde el 13/11/2026, para tardar menos (unos 4 min antes, cerca de 1 min 25 s ahora, estimado):
# - La batería de «npm test» va repartida en trabajos que corren a la vez
#   (.github/partes-ci.mjs): cinco con las pruebas de base de datos, web,
#   herramientas y acceso, y uno con la app móvil.
# - El PR que solo cambia el sello (rwadar-app/data/relanzamiento/estado.json)
#   no corre la batería entera, sino el trabajo «sello»: las pruebas de la
#   batería que leen el sello y la misma compuerta que «Publicar web». Un sello
#   nunca se une sin validar.
# - La comprobación que piden las reglas de la rama sigue siendo «pruebas»:
#   ahora es el último trabajo, espera a todos y falla si alguno falla o se
#   cancela.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwadar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pruebas: ${{ steps.cambios.outputs.pruebas }}
      sello: ${{ steps.cambios.outputs.sello }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En un PR se descarga la unión con la base; con su padre se ve qué cambia.
          fetch-depth: 2

      - name: Ver si el PR cambia algo más que documentación
        id: cambios
        shell: bash
        # La regla está en el script para poder probarla: .github/flujos.test.mjs.
        run: bash .github/cambios-ci.sh

      # Desde el 14/11/2026: el PR de las noticias automáticas de la mañana
      # («Noticias automáticas del DD/MM/AAAA») solo puede cambiar las dos
      # copias de las noticias, la carpeta del día y el sello. Así no lo hace
      # cumplir solo la sesión que lee webs de terceros. Con el Node que trae
      # el runner (solo módulos de Node, sin instalar nada ni usar la red) y en
      # menos de un segundo; en los demás PR no mira nada. El título va por
      # una variable, nunca escrito dentro del guion.
      - name: El PR de las noticias automáticas solo lleva noticias
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: node .github/noticias-pr.mjs

      - name: Preparar escáner verificado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rwadar-gitleaks"
          # Reintentos con espera creciente (1, 2, 4… 64 s; unos 2 min en total):
          # el 08/11/2026 unos 504 de GitHub de más de 20 s dejaron un PR en rojo.
          # Lo que se descarga lo sigue comprobando la huella de abajo.
          curl --fail --silent --show-error --location \
            --retry 7 --retry-all-errors --retry-max-time 180 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/rwadar-gitleaks/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/rwadar-gitleaks/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/rwadar-gitleaks/gitleaks.tar.gz" \
            -C "$RUNNER_TEMP/rwadar-gitleaks" gitleaks

      - name: Bloquear secretos en el contenido actual
        shell: bash
        run: |
          "$RUNNER_TEMP/rwadar-gitleaks/gitleaks" dir . \
            --config rwadar-app/gitleaks.toml \
            --redact=100 --no-banner --no-color --ignore-gitleaks-allow

  # La batería de «npm test», en partes que van a la vez. Qué lleva cada parte
  # lo decide .github/partes-ci.mjs a partir de los package.json, así que una
  # prueba nueva entra sola. Cada parte instala solo lo que necesita.
  # Cinco partes y no cuatro: así cada una queda bien por debajo del minuto
  # (GitHub cobra cada trabajo por minutos enteros) y la espera es algo menor.
  bateria:
    name: ${{ matrix.nombre }}
    needs: secretos
    # Corre aunque el escáner encuentre algo, para ver los dos resultados.
    if: ${{ !cancelled() && needs.secretos.outputs.pruebas == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Si una parte falla, las demás siguen: así se ven todos los fallos de una vez.
      fail-fast: false
      matrix:
        include:
          - { parte: bateria-1, nombre: 'Batería 1/6', base: true, movil: false, auditar: rwadar-app }
          - { parte: bateria-2, nombre: 'Batería 2/6', base: true, movil: false, auditar: '' }
          - { parte: bateria-3, nombre: 'Batería 3/6', base: true, movil: false, auditar: '' }
          - { parte: bateria-4, nombre: 'Batería 4/6', base: true, movil: false, auditar: '' }
          - { parte: bateria-5, nombre: 'Batería 5/6', base: true, movil: false, auditar: '' }
          - { parte: bateria-6, nombre: 'Batería 6/6', base: true, movil: false, auditar: '' }
          - { parte: movil, nombre: 'App móvil', base: false, movil: true, auditar: rwadar-movil }
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Parche de seguridad de Node del 21/10/2026 (TLS, Brotli y certificados
          # de eMudhra). Versión exacta: no se usa la que traiga en caché el runner.
          node-version: 22.23.4
          cache: npm
          # La misma caché para todas las partes (una sola copia que guardar).
          cache-dependency-path: |
            rwadar-app/package-lock.json
            rwadar-movil/package-lock.json

      - name: Comprobar que Node lleva el parche de seguridad
        run: node rwadar-node-seguro.js

      - name: Instalar dependencias de base de datos
        if: ${{ matrix.base }}
        run: npm ci --prefix rwadar-app --ignore-scripts

      # El importador de fotos de Wikimedia Commons (22/11/2026) y su prueba
      # sin red, dentro de test:web, necesitan Pillow con WebP. Versión exacta,
      # solo en rueda ya compilada; sin ella la prueba falla, no se salta.
      - name: Instalar Pillow (prueba del importador de fotos)
        if: ${{ matrix.base }}
        run: 'python3 -m pip install --user --break-system-packages --only-binary=:all: Pillow==12.3.0'

      - name: Instalar dependencias móviles
        if: ${{ matrix.movil }}
        run: npm ci --prefix rwadar-movil --ignore-scripts

      - name: Aplicar el parche de seguridad de Expo (uuidv5 en iOS)
        if: ${{ matrix.movil }}
        run: npm --prefix rwadar-movil run postinstall

      # Incluye las pruebas de .github/ (vigilante, flujos, copias y detección
      # de cambios): van al final de «npm --prefix rwadar-app test». No en el
      # package.json de la raíz: el guardián de la OTA lo trata como nativo.
      - name: Ejecutar su parte de la batería
        env:
          PARTE: ${{ matrix.parte }}
        run: node .github/partes-ci.mjs "$PARTE"

      - name: Bloquear dependencias críticas conocidas
        if: ${{ matrix.auditar != '' }}
        env:
          PAQUETE: ${{ matrix.auditar }}
        run: npm audit --prefix "$PAQUETE" --omit=dev --audit-level=critical

  # PR que solo cambia el sello: lo que la batería comprueba de estado.json y,
  # además, la compuerta con la que empieza «Publicar web» (aprobación,
  # fechas, controles, commit aprobado y huella del contenido).
  sello:
    name: Sello
    needs: secretos
    if: ${{ !cancelled() && needs.secretos.outputs.sello == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código con su historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La compuerta busca el commit aprobado, aunque main haya avanzado.
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            rwadar-app/package-lock.json
            rwadar-movil/package-lock.json

      - name: Comprobar que Node lleva el parche de seguridad
        run: node rwadar-node-seguro.js

      - name: Instalar dependencias de base de datos
        run: npm ci --prefix rwadar-app --ignore-scripts

      - name: Las pruebas de la batería que leen el sello
        run: node .github/partes-ci.mjs sello

      - name: La compuerta de «Publicar web» sobre el sello
        run: node rwadar-app/auditar-relanzamiento.mjs

  # La comprobación que exigen las reglas de la rama. Corre siempre (también si
  # algo falla o se cancela) salvo en un PR de solo documentación sin
  # problemas, donde se salta y cuenta como correcta, como antes.
  pruebas:
    needs: [secretos, bateria, sello]
    if: ${{ always() && !(needs.secretos.result == 'success' && needs.secretos.outputs.pruebas == 'false' && needs.secretos.outputs.sello == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar que ha pasado todo lo que tocaba
        shell: bash
        env:
          SECRETOS: ${{ needs.secretos.result }}
          BATERIA: ${{ needs.bateria.result }}
          SELLO: ${{ needs.sello.result }}
          TOCA_PRUEBAS: ${{ needs.secretos.outputs.pruebas }}
          TOCA_SELLO: ${{ needs.secretos.outputs.sello }}
        run: |
          set -euo pipefail
          echo "Escáner de secretos: $SECRETOS · batería: $BATERIA · sello: $SELLO"
          echo "Qué tocaba: pruebas=$TOCA_PRUEBAS, sello=$TOCA_SELLO"
          mal=0
          for resultado in "$SECRETOS" "$BATERIA" "$SELLO"; do
            case "$resultado" in success|skipped) ;; *) mal=1 ;; esac
          done
          [ "$SECRETOS" = success ] || { echo "El escáner de secretos no ha terminado bien."; mal=1; }
          case "$TOCA_PRUEBAS:$TOCA_SELLO" in
            true:false) [ "$BATERIA" = success ] || { echo "La batería no ha pasado entera."; mal=1; } ;;
            false:true) [ "$SELLO" = success ] || { echo "El sello no se ha validado."; mal=1; } ;;
            false:false) echo "Solo documentación." ;;
            *) echo "No se sabe qué había que probar."; mal=1 ;;
          esac
          if [ "$mal" -ne 0 ]; then echo "Algo ha fallado o se ha cancelado: mira los trabajos de arriba."; exit 1; fi
          echo "Todo lo que tocaba ha pasado."
