name: Verificación

# Solo en los PR (y a mano). Ya no corre otra vez al unir a main: lo que se une
# es lo mismo que acaba de pasar en el PR, y ningún otro flujo espera este
# resultado en main (07/11/2026, para ahorrar minutos de Actions).
#
# Si el PR solo cambia docs/** o archivos .md de la raíz, el escáner de
# secretos corre igual (un documento también puede llevar una clave pegada),
# pero la batería de pruebas se salta. Se salta con «if» y no con paths-ignore
# a propósito: un trabajo saltado cuenta como correcto, y así un PR de
# documentación nunca se queda con una comprobación «pendiente» si algún día se
# exige en las reglas de la rama. Las pruebas sí corren si alguno de esos
# documentos lo leen las pruebas o la compuerta de publicación (por ejemplo,
# AGENTS.md, docs/INTERNO.md o los informes que cita estado.json).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwadar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pruebas: ${{ steps.cambios.outputs.pruebas }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En un PR se descarga la unión con la base; con su padre se ve qué cambia.
          fetch-depth: 2

      - name: Ver si el PR cambia algo más que documentación
        id: cambios
        shell: bash
        # La regla está en el script para poder probarla: .github/flujos.test.mjs.
        run: bash .github/cambios-ci.sh

      - name: Preparar escáner verificado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rwadar-gitleaks"
          # Reintentos con espera creciente (1, 2, 4… 64 s; unos 2 min en total):
          # el 08/11/2026 unos 504 de GitHub de más de 20 s dejaron un PR en rojo.
          # Lo que se descarga lo sigue comprobando la huella de abajo.
          curl --fail --silent --show-error --location \
            --retry 7 --retry-all-errors --retry-max-time 180 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/rwadar-gitleaks/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$RUNNER_TEMP/rwadar-gitleaks/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/rwadar-gitleaks/gitleaks.tar.gz" \
            -C "$RUNNER_TEMP/rwadar-gitleaks" gitleaks

      - name: Bloquear secretos en el contenido actual
        shell: bash
        run: |
          "$RUNNER_TEMP/rwadar-gitleaks/gitleaks" dir . \
            --config rwadar-app/gitleaks.toml \
            --redact=100 --no-banner --no-color --ignore-gitleaks-allow

  pruebas:
    needs: secretos
    # Corre aunque el escáner encuentre algo, para ver los dos resultados.
    if: ${{ !cancelled() && needs.secretos.outputs.pruebas == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Parche de seguridad de Node del 21/10/2026 (TLS, Brotli y certificados
          # de eMudhra). Versión exacta: no se usa la que traiga en caché el runner.
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            rwadar-app/package-lock.json
            rwadar-movil/package-lock.json

      - name: Comprobar que Node lleva el parche de seguridad
        run: node rwadar-node-seguro.js

      - name: Instalar dependencias de base de datos
        run: npm ci --prefix rwadar-app --ignore-scripts

      - name: Instalar dependencias móviles
        run: npm ci --prefix rwadar-movil --ignore-scripts

      - name: Aplicar el parche de seguridad de Expo (uuidv5 en iOS)
        run: npm --prefix rwadar-movil run postinstall

      # Incluye las pruebas de .github/ (vigilante, flujos, copias y detección
      # de cambios): van al final de «npm --prefix rwadar-app test». No en el
      # package.json de la raíz: el guardián de la OTA lo trata como nativo.
      - name: Ejecutar toda la batería local
        run: npm test

      - name: Bloquear dependencias críticas conocidas
        run: |
          npm audit --prefix rwadar-app --omit=dev --audit-level=critical
          npm audit --prefix rwadar-movil --omit=dev --audit-level=critical
