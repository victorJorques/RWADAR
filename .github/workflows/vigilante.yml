name: Vigilante diario

# Comprobación diaria, de SOLO LECTURA, de lo que ya está publicado. No
# publica, no escribe en la base y no envía nada. Si algo falla, el flujo
# sale en rojo y GitHub manda un correo; cada fallo dice qué hacer (también
# arriba, en la página del flujo). Detalle: .github/vigilante.mjs.
#
# Comprueba: portada, puerta de la Academy (303 sin cuenta), privacidad,
# version-android.json de la última release, que el catálogo no caduque en
# menos de 48 h, que security.txt no caduque en menos de 30 días y que ningún
# trabajo de pg_cron haya fallado en las últimas 48 h.
#
# Necesita el secreto SUPABASE_DB_URL (el mismo de «Copia de seguridad»).
#
# Aviso a Víctor (08/11/2026): el correo de GitHub por un flujo en rojo va a
# quien cambió por última vez la línea «cron», y eso no se controla bien. Por
# eso, si algo falla, el propio flujo abre (o comenta) una incidencia en el
# repositorio que menciona a @victorJorques, con el enlace a esta ejecución; le
# llega por correo y en la app de GitHub sin que tenga que configurar nada.
# Cuando vuelve a salir todo bien, la cierra sola. GitHub solo ejecuta los
# horarios desde main.

on:
  schedule:
    # 05:17 UTC: 21:17 en California en invierno (22:17 en verano) y 06:17 en
    # España (07:17 en verano), fuera de las horas punta de GitHub.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwadar-vigilante
  cancel-in-progress: false

# Conexiones a Supabase siempre cifradas: con el «prefer» de libpq (lo que usa
# psql si la dirección no lleva sslmode), alguien en medio que rechace TLS haría
# seguir sin cifrar. Una sola regla para todos los flujos que usan
# SUPABASE_DB_URL; la comprueba .github/flujos.test.mjs.
env:
  PGSSLMODE: require

jobs:
  vigilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Permiso de incidencias solo para el aviso (abrir, comentar o cerrar
    # «Vigilante: algo falla en RWAdar»). El script no recibe ningún token.
    permissions:
      contents: read
      issues: write
    steps:
      # Solo lo que usa el vigilante: el script, la lista de lecciones y la
      # comprobación del parche de Node.
      - name: Descargar el script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/vigilante.mjs
            rwadar-academy/academy.json
            rwadar-node-seguro.js
          sparse-checkout-cone-mode: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Parche de seguridad de Node del 21/10/2026 (TLS, Brotli y certificados
          # de eMudhra). Versión exacta: no se usa la que traiga en caché el runner.
          node-version: 22.23.4

      - name: Comprobar que Node lleva el parche de seguridad
        run: node rwadar-node-seguro.js

      # Si esto falla, el vigilante lo dice en su informe («no está psql») y
      # aun así comprueba la web.
      - name: Instalar psql 17 (misma versión que Supabase)
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Vigilar la web, las descargas y la base
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node .github/vigilante.mjs

      # El cuerpo solo lleva la mención y el enlace: el detalle (ya tapado) se
      # queda en la página de la ejecución, que solo ve quien tiene acceso.
      - name: Avisar a Víctor si algo falla
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITULO='Vigilante: algo falla en RWAdar'
          NUM="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$TITULO\")) | .[0].number // empty")"
          CUERPO="@victorJorques el vigilante de hoy ha encontrado algo que falla. Abre este enlace: arriba sale qué falla y qué hacer, en llano. ${ENLACE}"
          if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "$CUERPO"
          else gh issue create --title "$TITULO" --body "$CUERPO"; fi

      - name: Cerrar el aviso si ya está todo bien
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITULO='Vigilante: algo falla en RWAdar'
          NUM="$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$TITULO\")) | .[0].number // empty")"
          if [ -n "$NUM" ]; then gh issue close "$NUM" --comment "Hoy ha salido todo bien. La cierro sola. ${ENLACE}"; fi
