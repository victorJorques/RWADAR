name: Avisos a registrados (base)

# Aplica en Supabase, desde GitHub, la migración 30 (avisos a registrados),
# la 31 (el correo sale por Lettermint), la 32 (notificaciones: push de Expo
# con prioridad alta y notificaciones web), la 33 (las notificaciones web
# salen desde Supabase), la 34 (el pie de los correos, sin el nombre del
# titular) y sus scripts, con las mismas garantías que
# «Aplicar catálogo»: solo desde main, copia cifrada de la base antes de
# cambiar nada, cada SQL en su propia transacción y los verificadores al
# final. Solo hay acciones fijas: no se puede pasar un archivo cualquiera.
#
# Cada acción que cambia la base necesita orden expresa de Víctor (AGENTS.md)
# y escribir AVISOS en «confirmar». Los ensayos («ensayo-30», «ensayo-31»,
# «ensayo-32», «ensayo-33», «ensayo-34»), las verificaciones y «diagnostico-30» no
# cambian nada: un ensayo aplica su migración y sus verificadores dentro de
# una transacción que se deshace al final, para saber si entra en producción
# antes de aplicarla.
#
# «guardar-correo» crea o actualiza en Vault LETTERMINT_API_TOKEN (del secreto
# de GitHub con ese nombre) y RWADAR_REMITENTE (de la entrada «remitente»). No
# enciende el correo: eso es «activar-correo», que exige la 31, la 34 (el
# pie sin el nombre del titular) y esos dos.
# OJO: reaplicar la 30 devuelve el envío de correo al código de Brevo, el
# push de Expo a la prioridad normal y procesar() a su versión sin las
# notificaciones web; si la 31, la 32, la 33 y la 34 ya estaban aplicadas,
# hay que volver a aplicarlas, en ese orden (aplicar-31, aplicar-32,
# aplicar-33 y aplicar-34). Reaplicar la 31 devuelve el nombre del titular
# al pie de los correos: después, aplicar-34.
#
# «crear-vapid» genera en esta máquina (node, sin npm) el par de claves P-256
# de las notificaciones web y guarda la privada en Vault (RWADAR_VAPID_PRIVADA)
# y la pública en la configuración (sale en el resumen; la privada, nunca).
# Si ya hay una, no la cambia. «rotar-vapid» la sustituye y borra las
# suscripciones web, que se hicieron con la anterior. Ninguna enciende nada.
#
# «prueba-webpush» (migración 33; escribiendo AVISOS) manda «Prueba de
# RWAdar» a los navegadores de las cuentas de administración por el mismo
# camino que los envíos de verdad: la base pide cada notificación al
# servidor de la web con pg_net, y el servidor la cifra, la firma y la
# entrega al servicio de push. No depende del interruptor del push ni
# cambia nada en la base (salvo borrar una suscripción caducada, 404/410,
# de esas cuentas), así que no hace copia. Espera unos segundos a que pg_net
# responda y solo enseña cuentas y códigos.
#
# Usa los secretos de la copia de seguridad: SUPABASE_DB_URL y COPIA_CLAVE;
# y, solo en guardar-correo, LETTERMINT_API_TOKEN.
# Contrato: docs/tareas/AVISOS-Y-ACADEMY-REGISTRO-2026-11-05.md.

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Qué hacer'
        required: true
        type: choice
        options:
          - ensayo-30
          - verificar-30
          - diagnostico-30
          - aplicar-30
          - ensayo-31
          - verificar-31
          - aplicar-31
          - guardar-correo
          - ensayo-32
          - verificar-32
          - aplicar-32
          - crear-vapid
          - rotar-vapid
          - ensayo-33
          - verificar-33
          - aplicar-33
          - prueba-webpush
          - ensayo-34
          - verificar-34
          - aplicar-34
          - activar-casilla
          - activar-correo
          - activar-push
          - apagar
          - apagar-casilla
          - hacer-admin
      confirmar:
        description: 'Escribe AVISOS para las acciones que cambian la base y para prueba-webpush (no hace falta para los ensayos, las verificaciones ni diagnostico-30)'
        required: false
        type: string
      remitente:
        description: 'Solo para guardar-correo: dirección desde la que salen los avisos, del dominio verificado en Lettermint (no es secreta)'
        required: false
        type: string
      huella:
        description: 'Solo para hacer-admin: SHA-256 en hexadecimal del correo de la cuenta, en minúsculas y sin espacios (nunca el correo)'
        required: false
        type: string

permissions:
  contents: read

# La misma cola que «Aplicar catálogo»: nunca dos escrituras a la vez.
concurrency:
  group: rwadar-aplicar-catalogo
  cancel-in-progress: false

# Conexiones a Supabase siempre cifradas: con el «prefer» de libpq (lo que usa
# psql si la dirección no lleva sslmode), alguien en medio que rechace TLS haría
# seguir sin cifrar. Una sola regla para todos los flujos que usan
# SUPABASE_DB_URL; la comprueba .github/flujos.test.mjs.
env:
  PGSSLMODE: require

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Los avisos solo se aplican desde main (se pidió desde ${GITHUB_REF})."
          exit 1

      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Comprobar la acción
        env:
          ACCION: ${{ inputs.accion }}
          CONFIRMAR: ${{ inputs.confirmar }}
          REMITENTE: ${{ inputs.remitente }}
          HUELLA: ${{ inputs.huella }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          D=rwadar-app/db
          V30="$D/30_avisos_registrados_verificar.sql"
          V31="$D/31_correo_lettermint_verificar.sql"
          V32="$D/32_notificaciones_verificar.sql"
          V33="$D/33_webpush_supabase_verificar.sql"
          V34="$D/34_pie_sin_nombre_verificar.sql"
          # VERIFICADORES: los que se pasan al final (o dentro del ensayo).
          ENSAYO=no
          VERIFICADORES="$V30"
          case "$ACCION" in
            ensayo-30)       SQL="$D/30_avisos_registrados.sql";                CAMBIA=no; ENSAYO=si ;;
            verificar-30)    SQL="$V30";                                         CAMBIA=no ;;
            diagnostico-30)  SQL="$D/30_avisos_registrados_diagnostico.sql";    CAMBIA=no ;;
            aplicar-30)      SQL="$D/30_avisos_registrados.sql";                CAMBIA=si ;;
            ensayo-31)       SQL="$D/31_correo_lettermint.sql";                 CAMBIA=no; ENSAYO=si; VERIFICADORES="$V30 $V31" ;;
            verificar-31)    SQL="$V31";                                         CAMBIA=no; VERIFICADORES="$V30 $V31" ;;
            aplicar-31)      SQL="$D/31_correo_lettermint.sql";                 CAMBIA=si; VERIFICADORES="$V30 $V31" ;;
            guardar-correo)  SQL="$D/31_correo_lettermint_guardar.sql";         CAMBIA=si ;;
            ensayo-32)       SQL="$D/32_notificaciones.sql";                    CAMBIA=no; ENSAYO=si; VERIFICADORES="$V30 $V31 $V32" ;;
            verificar-32)    SQL="$V32";                                         CAMBIA=no; VERIFICADORES="$V30 $V31 $V32" ;;
            aplicar-32)      SQL="$D/32_notificaciones.sql";                    CAMBIA=si; VERIFICADORES="$V30 $V31 $V32" ;;
            crear-vapid)     SQL="$D/32_notificaciones_vapid.sql";              CAMBIA=si; VERIFICADORES="$V30 $V32" ;;
            rotar-vapid)     SQL="$D/32_notificaciones_vapid.sql";              CAMBIA=si; VERIFICADORES="$V30 $V32" ;;
            ensayo-33)       SQL="$D/33_webpush_supabase.sql";                  CAMBIA=no; ENSAYO=si; VERIFICADORES="$V30 $V31 $V32 $V33" ;;
            verificar-33)    SQL="$V33";                                         CAMBIA=no; VERIFICADORES="$V30 $V31 $V32 $V33" ;;
            aplicar-33)      SQL="$D/33_webpush_supabase.sql";                  CAMBIA=si; VERIFICADORES="$V30 $V31 $V32 $V33" ;;
            # Envía (solo a administración) pero no cambia la base: sin copia,
            # con AVISOS (abajo) y los verificadores al final.
            prueba-webpush)  SQL="$D/33_webpush_supabase_prueba.sql";           CAMBIA=no; VERIFICADORES="$V30 $V32 $V33" ;;
            ensayo-34)       SQL="$D/34_pie_sin_nombre.sql";                    CAMBIA=no; ENSAYO=si; VERIFICADORES="$V30 $V31 $V32 $V33 $V34" ;;
            verificar-34)    SQL="$V34";                                         CAMBIA=no; VERIFICADORES="$V30 $V31 $V32 $V33 $V34" ;;
            aplicar-34)      SQL="$D/34_pie_sin_nombre.sql";                    CAMBIA=si; VERIFICADORES="$V30 $V31 $V32 $V33 $V34" ;;
            activar-casilla) SQL="$D/30_avisos_registrados_activar_casilla.sql"; CAMBIA=si ;;
            activar-correo)  SQL="$D/30_avisos_registrados_activar_correo.sql";  CAMBIA=si; VERIFICADORES="$V30 $V31 $V34" ;;
            activar-push)    SQL="$D/30_avisos_registrados_activar_push.sql";    CAMBIA=si ;;
            apagar)          SQL="$D/30_avisos_registrados_apagar.sql";          CAMBIA=si ;;
            apagar-casilla)  SQL="$D/30_avisos_registrados_apagar_casilla.sql";  CAMBIA=si ;;
            # Marca una cuenta como administración por la huella de su correo.
            hacer-admin)     SQL="$D/admin_por_huella.sql";                      CAMBIA=si ;;
            *) echo "Acción no válida: $ACCION"; exit 1 ;;
          esac
          test -f "$SQL" || { echo "No existe $SQL"; exit 1; }
          for V in $VERIFICADORES; do test -f "$V" || { echo "No existe $V"; exit 1; }; done
          if [ "$CAMBIA" = si ] && [ "$CONFIRMAR" != "AVISOS" ]; then
            echo "Esta acción cambia la base: escribe AVISOS en «confirmar»."; exit 1
          fi
          if [ "$ACCION" = hacer-admin ] && ! [[ "${HUELLA:-}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "hacer-admin necesita en «huella» el SHA-256 en hexadecimal (64 caracteres, minúsculas) del correo de la cuenta, nunca el correo."; exit 1
          fi
          if [ "$ACCION" = prueba-webpush ] && [ "$CONFIRMAR" != "AVISOS" ]; then
            echo "La prueba envía notificaciones a las cuentas de administración: escribe AVISOS en «confirmar»."; exit 1
          fi
          if [ "$ACCION" = guardar-correo ]; then
            REMITENTE="${REMITENTE:-}"
            # Una dirección sencilla (más estricta que la de la base), sin
            # nombre ni <>: el correo sale como «RWAdar <remitente>».
            CORREO_VALIDO='^[A-Za-z0-9._%+-]+@[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$'
            (( ${#REMITENTE} <= 254 )) && [[ "$REMITENTE" =~ $CORREO_VALIDO ]] \
              || { echo "guardar-correo necesita en «remitente» una dirección de correo válida, sin nombre ni <>."; exit 1; }
          fi
          # Las dos copias de la 30, de la 31, de la 32, de la 33 y de la 34
          # deben ser idénticas (la del CLI y la del SQL Editor).
          cmp -s "$D/30_avisos_registrados.sql" rwadar-app/supabase/migrations/20261105200000_avisos_registrados.sql \
            || { echo "Las dos copias de la 30 no coinciden"; exit 1; }
          cmp -s "$D/31_correo_lettermint.sql" rwadar-app/supabase/migrations/20261106120000_correo_lettermint.sql \
            || { echo "Las dos copias de la 31 no coinciden"; exit 1; }
          cmp -s "$D/32_notificaciones.sql" rwadar-app/supabase/migrations/20261112130000_notificaciones.sql \
            || { echo "Las dos copias de la 32 no coinciden"; exit 1; }
          cmp -s "$D/33_webpush_supabase.sql" rwadar-app/supabase/migrations/20261112170000_webpush_supabase.sql \
            || { echo "Las dos copias de la 33 no coinciden"; exit 1; }
          cmp -s "$D/34_pie_sin_nombre.sql" rwadar-app/supabase/migrations/20261112210000_pie_sin_nombre.sql \
            || { echo "Las dos copias de la 34 no coinciden"; exit 1; }
          { echo "SQL=$SQL"; echo "CAMBIA=$CAMBIA"; echo "ENSAYO=$ENSAYO"; echo "VERIFICADORES=$VERIFICADORES"; } >> "$GITHUB_ENV"

      - name: Instalar psql y pg_dump 17 (misma versión que Supabase)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Copia de seguridad antes de cambiar nada
        if: env.CAMBIA == 'si'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          COPIA_CLAVE: ${{ secrets.COPIA_CLAVE }}
        run: bash rwadar-app/copia-seguridad.sh copia-antes-avisos

      - name: Guardar la copia 35 días
        if: env.CAMBIA == 'si'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copia-antes-avisos-${{ inputs.accion }}-${{ github.run_number }}
          path: copia-antes-avisos/
          retention-days: 35
          compression-level: 0
          if-no-files-found: error

      - name: Ensayo sin cambiar nada (se deshace al final)
        if: env.ENSAYO == 'si'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # La migración es una sola transacción (begin; … commit;). Se cambia
          # su commit final por los verificadores (sin su propia transacción)
          # y un rollback.
          [ "$(grep -c '^commit;$' "$SQL")" = 1 ] && [ "$(tail -n 1 "$SQL")" = "commit;" ] \
            || { echo "$SQL no termina en un único commit;"; exit 1; }
          ENSAYO_SQL="$(mktemp)"
          head -n -1 "$SQL" > "$ENSAYO_SQL"
          for V in $VERIFICADORES; do
            [ "$(grep -c '^begin transaction read only;$' "$V")" = 1 ] && [ "$(tail -n 1 "$V")" = "rollback;" ] \
              || { echo "El verificador $V no tiene la forma esperada"; exit 1; }
            grep -v '^begin transaction read only;$' "$V" | head -n -1 >> "$ENSAYO_SQL"
          done
          echo 'rollback;' >> "$ENSAYO_SQL"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$ENSAYO_SQL"
          echo "ENSAYO CORRECTO: $(basename "$SQL") y sus verificadores pasan en producción. No se ha cambiado nada (rollback)."

      - name: Aplicar
        if: env.CAMBIA == 'si' && inputs.accion != 'guardar-correo' && inputs.accion != 'crear-vapid' && inputs.accion != 'rotar-vapid' && inputs.accion != 'hacer-admin'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ACCION: ${{ inputs.accion }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$SQL"
          if [ "$ACCION" = aplicar-30 ]; then
            echo "Aviso: reaplicar la 30 devuelve el envío de correo al código de Brevo, el push de Expo a la prioridad normal y procesar() a su versión sin las notificaciones web. Si la 31, la 32, la 33 y la 34 ya estaban aplicadas, vuelve a aplicarlas en ese orden (aplicar-31, aplicar-32, aplicar-33 y aplicar-34)."
          fi
          if [ "$ACCION" = aplicar-31 ]; then
            echo "Aviso: la 31 pone en el pie de los correos el nombre del titular. Si la 34 ya estaba aplicada, vuelve a aplicarla (aplicar-34) para quitarlo."
          fi

      # El token llega por el entorno y pasa a psql como variable (-v); nunca
      # se escribe en el script ni se imprime. psql corre con -X y sin eco,
      # y el SQL usa VERBOSITY terse: un error no repite la línea del valor.
      # En la base, el valor solo va en un SELECT (set_config local a la
      # transacción), nunca en una sentencia DDL: Supabase registra las DDL
      # del rol postgres (log_statement = 'ddl') y lo dejaría en sus registros.
      - name: Guardar en Vault el token de Lettermint y el remitente
        if: inputs.accion == 'guardar-correo'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LETTERMINT_API_TOKEN: ${{ secrets.LETTERMINT_API_TOKEN }}
          REMITENTE: ${{ inputs.remitente }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          [ -n "${LETTERMINT_API_TOKEN:-}" ] \
            || { echo "Falta el secreto de GitHub LETTERMINT_API_TOKEN (Settings → Secrets → Actions)."; exit 1; }
          if (( ${#LETTERMINT_API_TOKEN} < 20 || ${#LETTERMINT_API_TOKEN} > 1024 )) || [[ "$LETTERMINT_API_TOKEN" =~ [^!-~] ]]; then
            echo "El secreto LETTERMINT_API_TOKEN no tiene forma de token (20 a 1024 caracteres visibles, sin espacios)."; exit 1
          fi
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v token="$LETTERMINT_API_TOKEN" -v remitente="$REMITENTE" \
            -f "$SQL"

      # La huella pasa a psql como variable (-v) y en la base solo va en un
      # SELECT (set_config local): ni el correo ni la huella van a una DDL.
      - name: Marcar una cuenta como administración (por la huella de su correo)
        if: inputs.accion == 'hacer-admin'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HUELLA: ${{ inputs.huella }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -v huella="$HUELLA" -f "$SQL"

      - name: Preparar Node.js (solo crear-vapid y rotar-vapid)
        if: inputs.accion == 'crear-vapid' || inputs.accion == 'rotar-vapid'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Parche de seguridad de Node del 21/10/2026. Sin npm: el par de
          # claves sale de node:crypto.
          node-version: 22.23.4

      # El par de claves nace en esta máquina; la privada se enmascara en
      # cuanto existe y pasa a psql como variable (-v), como el token de
      # guardar-correo: nunca a un archivo, a Git ni a la salida. En la base
      # solo va en un SELECT (set_config local a la transacción), nunca en una
      # DDL que Supabase registraría con el valor. La pública sí sale en el
      # resumen: la necesita la web y no es secreta.
      - name: Crear o rotar la clave VAPID de las notificaciones web
        if: inputs.accion == 'crear-vapid' || inputs.accion == 'rotar-vapid'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ACCION: ${{ inputs.accion }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          node rwadar-node-seguro.js
          PAR="$(node rwadar-app/enviar-webpush.mjs generar-claves)"
          PRIVADA="${PAR%% *}"
          PUBLICA="${PAR#* }"
          unset PAR
          if [ -n "$PRIVADA" ]; then echo "::add-mask::$PRIVADA"; fi
          if ! [[ "$PRIVADA" =~ ^[A-Za-z0-9_-]{43}$ && "$PUBLICA" =~ ^B[A-Za-z0-9_-]{86}$ ]]; then
            echo "No se pudo generar el par de claves P-256."; exit 1
          fi
          ROTAR=no
          if [ "$ACCION" = rotar-vapid ]; then ROTAR=si; fi
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 \
            -v privada="$PRIVADA" -v publica="$PUBLICA" -v rotar="$ROTAR" \
            -f "$SQL"
          unset PRIVADA
          GUARDADA="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 \
            -c "select coalesce(webpush_clave_publica, '') from rwadar_novedades.configuracion where unica")"
          [[ "$GUARDADA" =~ ^B[A-Za-z0-9_-]{86}$ ]] || { echo "La clave pública no quedó guardada."; exit 1; }
          echo "Clave pública VAPID (la que usa la web): $GUARDADA"
          {
            echo "### Clave pública VAPID de las notificaciones web"
            echo
            echo "\`$GUARDADA\`"
            echo
            echo "La privada está en Vault (RWADAR_VAPID_PRIVADA) y no sale de la base."
          } >> "$GITHUB_STEP_SUMMARY"

      # La prueba de punta a punta del envío desde Supabase (migración 33),
      # solo a las cuentas de administración: la base pide cada notificación
      # al servidor de la web con pg_net, que la manda al confirmarse la
      # orden. Después se lee, cada 5 segundos durante un minuto como mucho,
      # lo que respondió. psql solo devuelve números: primero las peticiones
      # de pg_net con su suscripción y después cuentas y códigos; nunca
      # endpoints, claves ni cargas. Falla si ninguna notificación llega a
      # aceptarse.
      - name: Probar las notificaciones web desde Supabase
        if: inputs.accion == 'prueba-webpush'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          resumen() {
            {
              echo "### Notificaciones web desde Supabase (prueba)"
              echo
              for linea in "$@"; do echo "- $linea"; done
            } >> "$GITHUB_STEP_SUMMARY"
          }
          PETICIONES="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 \
            -c "select rwadar_novedades.webpush_prueba_supabase()")"
          LISTA='^\[(\[[1-9][0-9]{0,17}, [1-9][0-9]{0,17}\](, \[[1-9][0-9]{0,17}, [1-9][0-9]{0,17}\])*)?\]$'
          [[ "$PETICIONES" =~ $LISTA ]] || { echo "Respuesta inesperada de la base al pedir la prueba."; exit 1; }
          if [ "$PETICIONES" = "[]" ]; then
            echo "Ninguna cuenta de administración tiene la web suscrita: no sale nada."
            resumen "Ninguna cuenta de administración tiene la web suscrita: actívalas en Perfil desde el móvil."
            exit 0
          fi
          CODIGOS='^\[(-?[0-9]{1,3}(, -?[0-9]{1,3})*)?\]$'
          for _ in $(seq 1 12); do
            sleep 5
            LINEA="$(psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 \
              -v peticiones="$PETICIONES" -f "$SQL")"
            IFS='|' read -r ENVIOS ESPERANDO ENVIADOS CADUCADAS FALLIDOS SERVIDOR COD_PUSH COD_SERVIDOR <<< "$LINEA"
            for n in "$ENVIOS" "$ESPERANDO" "$ENVIADOS" "$CADUCADAS" "$FALLIDOS" "$SERVIDOR"; do
              [[ "$n" =~ ^[0-9]+$ ]] || { echo "Respuesta inesperada de la base al leer la prueba."; exit 1; }
            done
            [[ "$COD_PUSH" =~ $CODIGOS && "$COD_SERVIDOR" =~ $CODIGOS ]] \
              || { echo "Respuesta inesperada de la base al leer la prueba."; exit 1; }
            if [ "$ESPERANDO" = 0 ]; then break; fi
          done
          echo "Prueba desde Supabase: $ENVIOS notificación(es); $ENVIADOS aceptada(s) por el servicio de push, $CADUCADAS suscripción(es) caducada(s) borrada(s), $FALLIDOS fallida(s), $SERVIDOR sin respuesta válida del servidor de la web y $ESPERANDO sin respuesta todavía."
          echo "Códigos de los servicios de push: $COD_PUSH. Códigos del servidor de la web (cuando no respondió bien): $COD_SERVIDOR."
          resumen "Notificaciones pedidas: $ENVIOS" \
            "Aceptadas por el servicio de push: $ENVIADOS" \
            "Suscripciones caducadas borradas (404/410): $CADUCADAS" \
            "Fallidas: $FALLIDOS" \
            "Sin respuesta válida del servidor de la web: $SERVIDOR" \
            "Sin respuesta todavía (pg_net): $ESPERANDO" \
            "Códigos de los servicios de push: $COD_PUSH" \
            "Códigos del servidor de la web (cuando no respondió bien): $COD_SERVIDOR"
          if [ "$ENVIADOS" = 0 ]; then
            echo "::error::Ninguna notificación de prueba se aceptó: revisa los códigos."
            exit 1
          fi

      - name: Diagnóstico (solo lee)
        if: inputs.accion == 'diagnostico-30'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$SQL"

      - name: Verificar
        if: env.ENSAYO != 'si' && inputs.accion != 'diagnostico-30'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          for V in $VERIFICADORES; do
            echo "Verificador: $V"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$V"
          done
