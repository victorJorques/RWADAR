name: Publicar web

# Publicación MANUAL de la web en Cloudflare Pages desde GitHub. Nunca se
# lanza sola: solo con «Run workflow» (o por API) y eligiendo el destino.
# Ejecuta exactamente lo mismo que en local (rwadar-publicar.js), con todas
# sus compuertas: aprobación en estado.json, árbol Git limpio, Auth segura,
# catálogo sincronizado sin cambios y CSP. Si algo no cuadra, no publica.
# Después comprueba la web real página a página.
#
# Necesita el secreto de repositorio CLOUDFLARE_API_TOKEN (permiso de
# edición de Cloudflare Pages). Ver docs/OPERACION-LANZAMIENTO.md.

on:
  workflow_dispatch:
    inputs:
      destino:
        description: 'Dónde publicar'
        required: true
        default: preview
        type: choice
        options: [preview, produccion]

permissions:
  contents: read

concurrency:
  group: rwadar-publicar-web
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "La publicación solo se lanza desde main (se pidió desde ${GITHUB_REF})."
          exit 1

      - name: Descargar el código con su historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Parche de seguridad de Node del 21/10/2026 (TLS, Brotli y certificados
          # de eMudhra). Versión exacta: no se usa la que traiga en caché el runner.
          node-version: 22.23.4

      - name: Comprobar que Node lleva el parche de seguridad
        run: node rwadar-node-seguro.js

      - name: Comprobar que existe la credencial de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "FALTA EL SECRETO CLOUDFLARE_API_TOKEN en Settings › Secrets and variables › Actions."
            exit 1
          fi
          echo "Credencial presente."

      - name: Instalar las dependencias del auditor
        run: npm ci --prefix rwadar-app --ignore-scripts

      - name: Comprobar la aprobación antes de tocar la red
        run: node rwadar-app/auditar-relanzamiento.mjs

      - name: Publicar en ${{ inputs.destino }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 52d07be006e7a27f5f793c59e1796b13
        run: node rwadar-publicar.js --${{ inputs.destino }}

      - name: Comprobar la web publicada
        run: |
          if [ "${{ inputs.destino }}" = "produccion" ]; then
            URL=https://rwadar.pages.dev
          else
            URL=https://revision.rwadar.pages.dev
          fi
          # Cloudflare tarda unos segundos en servir el despliegue nuevo.
          for intento in 1 2 3 4 5 6; do
            if node .github/comprobar-publicado.mjs "$URL"; then exit 0; fi
            echo "Reintento $intento en 20 s…"; sleep 20
          done
          exit 1
