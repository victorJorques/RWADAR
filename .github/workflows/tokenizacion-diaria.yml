name: Foto diaria de la tokenización

# «La tokenización en el mundo» de Inicio (10/11/2026).
# Una vez al día lee CoinGecko (gratis, sin clave) y guarda la foto del día
# (fecha UTC, valor total, tipos y hora del dato) en tokenizacion-historico.json
# de la rama «datos-tokenizacion». Con esas fotos, la web y la app calculan los
# cambios a 7 días, 30 días, 1 año y desde el principio, solo con datos reales.
#
# - Si la rama no existe, la crea huérfana (sin el código) a partir de la
#   semilla de main (rwadar-site/datos/tokenizacion-historico.json).
# - Un commit por día. Si ya hay foto de ese día, no hace nada.
# - No publica nada: la web recoge el histórico la próxima vez que se publique
#   (paso «Traer el histórico de la tokenización» de publicar.yml).
# - No usa claves ni la base de datos. Su único permiso de escritura es el
#   contenido del repositorio, y solo empuja a la rama «datos-tokenizacion».
#
# Desde el 11/11/2026 rehace también la serie de un año del gráfico «estilo
# bolsa» de /mercado/ (tokenizacion-serie.json, en la misma rama): la suma
# diaria de los mayores tokens de la categoría con historia completa en
# CoinGecko (hoy 29 de los 40 mayores), con unas 42 llamadas gratuitas a
# CoinGecko y 13 s entre ellas (unos 9 minutos; con 3 s CoinGecko daba 429
# una vez sí y otra no). Si CoinGecko falla, si los tokens que no se leen
# pesan más del 1 % o si se acaba su plazo, se conserva la serie anterior y
# la foto del día se guarda igual.
#
# Desde el 13/11/2026, además, las series finas del gráfico
# (tokenizacion-serie-fina.json): un punto cada 5 minutos de las últimas 24
# horas y uno cada hora de los últimos 30 días, de los mismos tokens que la
# diaria. Son unas 60 llamadas más (dos por token que entra), con la misma
# pausa de 13 s: el 13/11/2026, 103 llamadas en total y 23 minutos, sin
# ningún 429. La diaria se guarda antes de empezar las finas; el script no
# empieza llamadas de la diaria pasados 20 minutos ni de las finas pasados
# 34, y el paso tiene 40 (una llamada con sus reintentos dura como mucho 5).
# Si fallan las finas, queda la diaria nueva y la fina anterior, que ya no
# casa con ella y no se usa: el gráfico sigue con la diaria.
#
# Script y pruebas: rwadar-app/tokenizacion/foto-diaria.mjs,
# rwadar-app/tokenizacion/serie-diaria.mjs y .github/tokenizacion.test.mjs.
# GitHub solo ejecuta los horarios desde main.

on:
  schedule:
    # 06:23 UTC (07:23 en España en invierno), con un minuto que no es redondo
    # para no coincidir con la hora punta de GitHub.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwadar-tokenizacion-diaria
  cancel-in-progress: false

jobs:
  foto:
    runs-on: ubuntu-24.04
    # La foto (unos 3 min como mucho), las series (40) y guardar: 50.
    timeout-minutes: 50
    # Escribir solo hace falta para empujar la foto a «datos-tokenizacion».
    permissions:
      contents: write
    steps:
      # Como publicar.yml: a mano solo se lanza desde main. Así nadie ejecuta
      # el código de otra rama con permiso de escritura.
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "La foto diaria solo se lanza desde main (se pidió desde ${GITHUB_REF})."
          exit 1

      # Sin sparse-checkout a propósito: «git worktree add» copiaría sus
      # patrones y la rama de datos saldría sin su archivo. Las credenciales
      # se quedan (por defecto) solo para empujar la foto.
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Parche de seguridad de Node del 21/10/2026 (TLS, Brotli y certificados
          # de eMudhra). Versión exacta: no se usa la que traiga en caché el runner.
          node-version: 22.23.4

      - name: Comprobar que Node lleva el parche de seguridad
        run: node rwadar-node-seguro.js

      - name: Preparar la rama de datos
        run: |
          set -euo pipefail
          DATOS="$RUNNER_TEMP/datos-tokenizacion"
          if git ls-remote --exit-code --heads origin datos-tokenizacion > /dev/null; then
            git fetch --no-tags origin datos-tokenizacion
            git worktree add --detach "$DATOS" FETCH_HEAD
            echo "Rama datos-tokenizacion encontrada."
          else
            # Huérfana: sin historia ni archivos del código.
            git worktree add --detach "$DATOS"
            git -C "$DATOS" checkout -q --orphan datos-tokenizacion
            git -C "$DATOS" rm -rfq .
            git -C "$DATOS" clean -fdxq
            echo "No existe la rama datos-tokenizacion: se crea a partir de la semilla de main."
          fi
          echo "DATOS=$DATOS" >> "$GITHUB_ENV"

      - name: Leer CoinGecko y añadir la foto de hoy
        id: foto
        run: >
          node rwadar-app/tokenizacion/foto-diaria.mjs "$DATOS/tokenizacion-historico.json"
          --semilla rwadar-site/datos/tokenizacion-historico.json

      # Si falla la diaria (código 3), no escribe nada: queda la serie
      # anterior y el flujo sigue para guardar la foto del día. Si fallan las
      # finas, la diaria nueva ya está escrita y la fina anterior se queda.
      # Su propio límite (40 min, menor que el del trabajo) evita que unos
      # 429 seguidos agoten el tiempo del trabajo y se pierda también la foto.
      - name: Rehacer la serie de un año y las finas (cada 5 minutos y cada hora)
        id: serie
        continue-on-error: true
        timeout-minutes: 40
        run: >
          node rwadar-app/tokenizacion/serie-diaria.mjs "$DATOS/tokenizacion-serie.json"
          --fina "$DATOS/tokenizacion-serie-fina.json"

      # Siempre que la foto haya ido bien: se guarda lo que haya en disco. Los
      # archivos se escriben enteros (nombre temporal y cambio de nombre), así
      # que nunca hay uno a medias; si el paso de las series se cortó por
      # tiempo después de guardar la diaria, la diaria nueva se guarda igual.
      - name: Guardar la foto y la serie (un commit por día)
        env:
          FECHA: ${{ steps.foto.outputs.fecha }}
        run: |
          set -euo pipefail
          [[ "$FECHA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Fecha no válida: $FECHA"; exit 1; }
          cd "$DATOS"
          git add tokenizacion-historico.json
          if [ -f tokenizacion-serie.json ]; then git add tokenizacion-serie.json; fi
          if [ -f tokenizacion-serie-fina.json ]; then git add tokenizacion-serie-fina.json; fi
          if git diff --cached --quiet; then echo "Nada nuevo que guardar."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Foto y serie de la tokenización del $FECHA (datos: CoinGecko)"
          git push origin HEAD:refs/heads/datos-tokenizacion
          echo "Foto y serie del $FECHA guardadas en la rama datos-tokenizacion."

      # El gráfico en directo (migración 35, 14/11/2026): si está encendido y
      # no responde bien dos veces seguidas (90 s entre ellas), este paso
      # falla y GitHub manda su aviso. Apagado (404 directo_apagado) o «no
      # casa» (unos minutos tras publicar otra lista), no falla. Va al final:
      # la foto y la serie ya están guardadas. Solo lee la web pública.
      - name: Comprobar el gráfico en directo
        run: |
          set -uo pipefail
          CODIGO=000; ERROR=""
          for intento in 1 2; do
            CODIGO="$(curl -sS -o "$RUNNER_TEMP/directo.json" -w '%{http_code}' --max-time 20 https://rwadar.pages.dev/api/tokenizacion/directo || echo 000)"
            ERROR="$(grep -o '"error":"[a-z_]*"' "$RUNNER_TEMP/directo.json" 2>/dev/null | head -n 1 | cut -d'"' -f4 || true)"
            case "$CODIGO:$ERROR" in
              200:*) echo "El directo responde bien."; exit 0 ;;
              404:directo_apagado) echo "El directo está apagado: nada que comprobar."; exit 0 ;;
              503:directo_no_casa) echo "El directo aún no casa con la diaria publicada (unos minutos tras publicar)."; exit 0 ;;
            esac
            echo "Intento $intento: el directo respondió $CODIGO ${ERROR:-sin código}."
            if [ "$intento" = 1 ]; then sleep 90; fi
          done
          echo "::error::El gráfico en directo está encendido y no responde bien ($CODIGO ${ERROR:-sin código}). Mira «Mercado en directo (base)», acción estado."
          echo "- El gráfico en directo no responde bien ($CODIGO ${ERROR:-sin código})." >> "$GITHUB_STEP_SUMMARY"
          exit 1
