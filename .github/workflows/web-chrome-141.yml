# PRIVATE manual browser QA only. Push registers the workflow; it never runs QA.
name: RWAdar web private Chrome session QA
run-name: Chrome login, cookie session and reload; no publication
on:
  push:
    branches: [codex/android-140-auth-qa]
  workflow_dispatch:
    inputs:
      entorno:
        description: Fixed RWAdar deployment to check
        required: true
        default: preview
        type: choice
        options: [preview, produccion]
      confirmed_test_account:
        description: CONFIRMED_TEST_ACCOUNT for the existing dedicated confirmed QA account
        required: true
        type: string
      qa_user_id:
        description: Exact existing dedicated QA UUID verified by the account helper
        required: true
        type: string
      qa_marker:
        description: Existing QA ownership marker verified by the account helper
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: rwadar-web141-chrome-qa
  cancel-in-progress: false
jobs:
  web-chrome-141:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout the exact private QA revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Validate manual QA scope and installed runtimes without account secrets
        env:
          QA_ACCOUNT_ACK: ${{ inputs.confirmed_test_account }}
          QA_USER_ID: ${{ inputs.qa_user_id }}
          QA_ACCOUNT_MARKER: ${{ inputs.qa_marker }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = victorJorques/RWADAR
          test "$GITHUB_REF" = refs/heads/codex/android-140-auth-qa
          test "$QA_ACCOUNT_ACK" = CONFIRMED_TEST_ACCOUNT
          test "$QA_USER_ID" = 8871c88e-b0af-415b-9346-dcceb182c2ac
          test "$QA_ACCOUNT_MARKER" = ba8cb4645588067ff77ef11a
          test -x /usr/bin/google-chrome
          test -f .github/qa-web-browser-141/web-chrome-141.cjs
          node_path="$(command -v node || true)"
          if ! test -n "$node_path" || ! test "$("$node_path" -p 'process.versions.node.split(".")[0]')" = 22; then
            node_path=''
            shopt -s nullglob
            for candidate in "$RUNNER_TOOL_CACHE"/node/22.*/x64/bin/node; do
              if test -x "$candidate" && test "$("$candidate" -p 'process.versions.node.split(".")[0]')" = 22; then
                node_path="$candidate"
                break
              fi
            done
          fi
          test -n "$node_path"
          test "$("$node_path" -p 'process.versions.node.split(".")[0]')" = 22
          printf 'RWADAR_NODE=%s\n' "$node_path" >> "$GITHUB_ENV"
      - name: Real Chrome session and reload with local logout and profile cleanup
        env:
          RWADAR_QA_WEB_ORIGIN: ${{ inputs.entorno == 'preview' && 'https://revision.rwadar.pages.dev' || 'https://rwadar.pages.dev' }}
          RWADAR_QA_EMAIL: ${{ secrets.RWADAR_QA_EMAIL }}
          RWADAR_QA_PASSWORD: ${{ secrets.RWADAR_QA_PASSWORD }}
          QA_ACCOUNT_ACK: ${{ inputs.confirmed_test_account }}
          QA_USER_ID: ${{ inputs.qa_user_id }}
          QA_ACCOUNT_MARKER: ${{ inputs.qa_marker }}
        shell: bash
        run: |
          set -euo pipefail
          # The helper fixes production, launches only /usr/bin/google-chrome,
          # records status-only JSON, and logs out/removes its profile in finally.
          "$RWADAR_NODE" .github/qa-web-browser-141/web-chrome-141.cjs
      - name: Safe bounded Chrome result only; no screenshots, traces or browser profile
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=evidence-private/web-chrome-141-result.json
          if test -f "$report"; then
            test "$(stat -c '%s' "$report")" -le 32768
            cat "$report"
          fi
