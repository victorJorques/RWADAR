# LOCAL TEMPLATE ONLY: copy to .github/workflows/android-release-140.yml in
# PUBLIC victorJorques/RWAdar-downloads. Contains no private product source.
# Default NO is inert. Complete exact reviewed metadata and both SI values
# only AFTER reviewing this APK's completed QA screenshots and evidence ZIP.
name: RWAdar 1.4.0 - Release previously reviewed Android QA
run-name: RWAdar 1.4.0 APK18 reviewed release
on:
  push:
    branches: [codex/android-140-release]
    paths: [.github/workflows/android-release-140.yml]
permissions:
  contents: read
concurrency:
  group: rwadar-apk18-reviewed-release
  cancel-in-progress: false
env:
  APK_URL: ''
  APK_SHA256: ''
  APK_BYTES: ''
  PUBLICAR_RELEASE: 'NO'
  VISUAL_REVIEWED: 'NO'
  QA20_REVIEWED: 'NO'
  SOURCE_HEAD_SHA: ''
  EAS_BUILD_ID: ''
  EXPECTED_COUNTS: '{"plataformas":26,"principales":24,"secundario":21,"en_camino":4}'
  ORIENTATION_POLICY: portrait
  QA_RUN_ID: ''
  QA_RUN_ATTEMPT: ''
  EXPECTED_QA_HEAD_SHA: ''
  EVIDENCE_SHA256: ''
  EVIDENCE_BYTES: ''
  CERT_SHA256: f506dea70ad644184161542d583455d2ad849c4dea3fffa0469c9ca400f58b72
  RELEASE_TAG: v1.4.0
jobs:
  review_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      publicar_release: ${{ steps.reviewed.outputs.publicar_release }}
      qa_head_sha: ${{ steps.reviewed.outputs.qa_head_sha }}
    steps:
      - name: Bind publication to the exact completed QA execution reviewed locally
        id: reviewed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = victorJorques/RWAdar-downloads
          test "$GITHUB_REF" = refs/heads/codex/android-140-release
          if test "$PUBLICAR_RELEASE" = NO; then
            printf 'publicar_release=NO\n' >> "$GITHUB_OUTPUT"
            echo 'Release remains disabled; no APK or release write.'
            exit 0
          fi
          test "$PUBLICAR_RELEASE" = SI
          test "$VISUAL_REVIEWED" = SI
          test "$QA20_REVIEWED" = SI
          [[ "$SOURCE_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EAS_BUILD_ID" =~ ^[a-f0-9-]{36}$ ]]
          [[ "$QA_RUN_ID" =~ ^[1-9][0-9]{5,14}$ ]]
          [[ "$QA_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,2}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN_ID/attempts/$QA_RUN_ATTEMPT" > qa-run.json
          python3 - <<'PY'
          import json, os, pathlib
          run = json.loads(pathlib.Path('qa-run.json').read_text())
          assert str(run['id']) == os.environ['QA_RUN_ID']
          assert str(run['run_attempt']) == os.environ['QA_RUN_ATTEMPT']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['repository']['full_name'] == 'victorJorques/RWAdar-downloads'
          assert run['head_branch'] == 'codex/android-140-release'
          assert run['path'] == '.github/workflows/android-smoke-140.yml'
          assert run['event'] in {'push', 'workflow_dispatch'}
          assert len(run['head_sha']) == 40
          assert run['head_sha'] == os.environ['EXPECTED_QA_HEAD_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as target:
              target.write('qa_head_sha=' + run['head_sha'] + '\npublicar_release=SI\n')
          PY
  release:
    name: Publish SAME APK after completed QA and visual evidence review
    needs: review_gate
    if: ${{ needs.review_gate.outputs.publicar_release == 'SI' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job can write a public release. No additional PAT or secret.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.run_id }}
      QA_HEAD_SHA: ${{ needs.review_gate.outputs.qa_head_sha }}
    steps:
      - name: Re-download and verify the byte-identical APK that passed the emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = victorJorques/RWAdar-downloads
          test "$GITHUB_REF" = refs/heads/codex/android-140-release
          test "$PUBLICAR_RELEASE" = SI
          test "$RELEASE_TAG" = v1.4.0
          [[ "$APK_URL" == https://expo.dev/artifacts/eas/*.apk ]]
          [[ "$APK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APK_BYTES" =~ ^[1-9][0-9]{6,8}$ ]]
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --retry 2 "$APK_URL" -o RWAdar.apk
          test "$(stat -c '%s' RWAdar.apk)" = "$APK_BYTES"
          printf '%s  RWAdar.apk\n' "$APK_SHA256" | sha256sum --check
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs RWAdar.apk > signature.txt
          test "$(grep -Ec '^Signer #[0-9]+ certificate SHA-256 digest:' signature.txt)" = 1
          grep -Fx "Signer #1 certificate SHA-256 digest: $CERT_SHA256" signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging RWAdar.apk > package.txt
          grep -F "package: name='com.rwadar.app' versionCode='18' versionName='1.4.0'" package.txt
          printf '%s  RWAdar.apk\n' "$APK_SHA256" > SHA256SUMS.txt
      - name: Recover exact QA evidence from its completed job logs before any release write
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EVIDENCE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EVIDENCE_BYTES" =~ ^[1-9][0-9]{0,7}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN_ID/attempts/$QA_RUN_ATTEMPT/jobs?per_page=100" > qa-jobs.json
          job_id="$(python3 - <<'PY'
          import json, os, pathlib
          jobs = json.loads(pathlib.Path('qa-jobs.json').read_text())['jobs']
          matches = [job for job in jobs if job['name'] == 'android'
                     and str(job['run_id']) == os.environ['QA_RUN_ID']
                     and job['head_sha'] == os.environ['QA_HEAD_SHA']
                     and job['status'] == 'completed' and job['conclusion'] == 'success']
          assert len(matches) == 1, 'Need exactly one successful QA job for THIS run attempt'
          print(matches[0]['id'])
          PY
          )"
          # Completed job logs can take a little time to become downloadable.
          ready=NO
          for attempt in 1 2 3 4 5 6; do
            if gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > qa-job.log; then
              ready=SI
              break
            fi
            sleep 10
          done
          test "$ready" = SI
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, zipfile
          # GitHub concatenates log blocks with UTF-8 BOMs; these are transport,
          # never base64 data. Exact size, sequence, SHA and ZIP CRC remain required.
          log = pathlib.Path('qa-job.log').read_text(encoding='utf-8').replace('\ufeff', '')
          # Anchor after the optional GitHub ISO timestamp. Echoed script source
          # cannot be mistaken for emitted lines, and sequence/size/hash are exact.
          prefix = r'^(?:\d{4}-\d{2}-\d{2}T[^ ]+ )?'
          metadata = re.findall(prefix + r'RWADAR_QA_ZIP_META ([a-f0-9]{64}) (\d+) (\d+)$', log, re.MULTILINE)
          chunks = re.findall(prefix + r'RWADAR_QA_ZIP_DATA (\d{6}) ([A-Za-z0-9+/=]+)$', log, re.MULTILINE)
          endings = re.findall(prefix + r'RWADAR_QA_ZIP_END$', log, re.MULTILINE)
          assert len(metadata) == 1 and len(endings) == 1, 'Missing/duplicate evidence markers'
          digest, size, count = metadata[0]
          assert digest == os.environ['EVIDENCE_SHA256'] and int(size) == int(os.environ['EVIDENCE_BYTES'])
          assert 0 < int(size) <= 48 * 1024 * 1024 and len(chunks) == int(count)
          assert [int(index) for index, _ in chunks] == list(range(int(count))), 'Incomplete/out-of-order ZIP chunks'
          payload = base64.b64decode(''.join(chunk for _, chunk in chunks), validate=True)
          assert len(payload) == int(size) and hashlib.sha256(payload).hexdigest() == digest, 'Evidence ZIP identity mismatch'
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              files = archive.infolist()
              assert 0 < len(files) <= 300
              assert len({f.filename for f in files}) == len(files), 'Duplicate ZIP paths'
              assert all((f.external_attr >> 16) & 0o170000 != 0o120000 for f in files), 'ZIP symlink'
              assert all(re.fullmatch(r'evidence/[A-Za-z0-9_.-]+\.(?:png|xml|json|txt|log)', f.filename) for f in files)
              print('RWADAR_QA_INVENTORY ' + json.dumps({
                  'files':[{'name':f.filename, 'bytes':f.file_size} for f in files],
                  'uncompressedBytes':sum(f.file_size for f in files),
                  'zipBytes':len(payload)}, ensure_ascii=False), flush=True)
              assert sum(f.file_size for f in files) <= 64 * 1024 * 1024 and all(f.file_size <= 4 * 1024 * 1024 for f in files)
              assert archive.testzip() is None, 'ZIP CRC failure'
              result = json.loads(archive.read('evidence/result.json'))
              contents = {entry.filename:archive.read(entry) for entry in files}
          def require(condition, message):
              assert condition, message
          SAFE_ENTRY = re.compile(r'evidence/[A-Za-z0-9_.-]+\.(?:png|xml|json|txt|log)')
          # Completed phases are reused from one immutable failed run, never relabelled.
          provenance = result.get("baselineProvenance")
          require(isinstance(provenance, dict), "Selective continuation provenance is missing")
          require(provenance == json.loads(contents["evidence/baseline-provenance.json"]), "Embedded provenance differs")
          require(provenance.get("mode") == "selective-continuation" and provenance.get("schemaVersion") == 1, "Wrong continuation mode")
          origin = provenance["baseline"]
          require(origin["runId"] == 39812931682 and origin["runAttempt"] == 1 and origin["jobId"] == 119943744862, "Wrong baseline execution")
          require(origin["headSha"] == "40f926f8ff4eeb3c99293b16a9c9a5dad9740c69", "Wrong baseline commit")
          require(origin["status"] == "completed" and origin["conclusion"] == "failure" and provenance["baselineFailedRunIsNotSuccessfulQa"] is True, "Historical failure must remain a failure")
          require(str(result["runId"]) != str(origin["runId"]), "Continuation requires its own successful execution")
          archive = provenance["archive"]
          require(archive["sha256"] == "497e69dae6ca957347e5f3887072e5c2374d9ad31063448d3b889732394a982a" and archive["bytes"] == 26986584 and archive["files"] == 159, "Wrong baseline archive")
          require(archive["crcVerified"] is True and archive["safePathsVerified"] is True, "Baseline ZIP checks missing")
          apk = provenance["apk"]
          for key, result_key in (("sha256","apkSha256"),("bytes","apkBytes"),("certificateSha256","certificateSha256"),("sourceCommit","sourceCommit"),("easBuildId","easBuildId")):
              require(apk[key] == result[result_key], "Baseline and continuation APK identities differ")
          reused = ["03","04","05","06","07","08","09","10","11","12","13","14"]
          pending = ["01","02","15","16","17","18","19","20"]
          require(provenance["reusedCheckIds"] == reused and provenance["continuationCheckIds"] == pending, "Wrong phase partition")
          for point in result["nativeChecks20"]:
              expected_origin = "baseline-39812931682" if point["id"] in reused else "current-continuation"
              require(point.get("evidenceOrigin") == expected_origin, "Per-point evidence origin differs")
          inventory = provenance["inventory"]
          require(len(inventory) == 159 and len({entry["storedPath"] for entry in inventory}) == 159, "Incomplete baseline inventory")
          for entry in inventory:
              original = entry["originalPath"]
              require(bool(SAFE_ENTRY.fullmatch(original)), "Unsafe original baseline path")
              require(entry["storedPath"] == "evidence/baseline-" + original.split("/")[1], "Baseline path mapping differs")
              data = contents[entry["storedPath"]]
              require(len(data) == entry["bytes"] and hashlib.sha256(data).hexdigest() == entry["sha256"], "Reused evidence bytes changed")
          paths = {entry["storedPath"] for entry in inventory}
          require(set(provenance["phaseEvidence"]) == set(reused), "Missing per-phase provenance")
          for references in provenance["phaseEvidence"].values():
              require(bool(references) and all("evidence/" + name in paths for name in references), "Phase evidence is missing")
          assert result['version'] == '1.4.0' and result['versionCode'] == 18
          assert result['apkSha256'] == os.environ['APK_SHA256'] and result['apkBytes'] == int(os.environ['APK_BYTES'])
          assert result['certificateSha256'] == os.environ['CERT_SHA256']
          assert result['headSha'] == os.environ['QA_HEAD_SHA'] and str(result['runId']) == os.environ['QA_RUN_ID']
          assert result['workflowSha'] == os.environ['QA_HEAD_SHA']
          assert result['sourceCommit'] == os.environ['SOURCE_HEAD_SHA']
          assert result['easBuildId'] == os.environ['EAS_BUILD_ID']
          assert result['installation'] and result['launch'] and result['localFavoritePersistsAfterRestart']
          expected = json.loads(os.environ['EXPECTED_COUNTS'])
          assert result['visibleCatalogPlatforms'] == expected['plataformas'] and result['catalogSchemaVersion'] == 2
          assert result['collections'] == {k:expected[k] for k in ('principales','secundario','en_camino')}
          checks = result['nativeChecks20']
          assert len(checks) == 20 and {c['id'] for c in checks} == {f'{i:02d}' for i in range(1,21)}
          assert all(c['status'] == 'checked' for c in checks)
          radar = result['radarNativeCentres']
          assert radar['checked'] and radar['count'] == expected['plataformas'] and radar['widthDp'] == 320
          assert radar['changedTouchesPresent'] and radar['allVisibleCentresOpenOwnPlatform']
          assert radar['exclusive44DpRegionsTested'] is False
          language = result['languageUi']
          assert all(language[k] is True for k in ['englishUi','englishPersistedAfterRestart','spanishUi',
            'spanishPersistedAfterRestart','originalSourceNoticeObserved','financialValuesAndUnitsUnchanged','sourceDatesUnchanged','sourceUrlsUnchanged'])
          assert language['credentialsEntered'] is False and language['englishRadarEvent']['selectedName'] == 'ADDX'
          assert language['englishRadarEvent']['changedTouches'] >= 1
          ui = result['integralUi']
          assert ui['fullTitleAndPersistentControls'] and ui['sourceDatesSeparated'] and ui['fourDecisionFacts']
          assert ui['fourRiskQuestions'] and ui['singlePrimarySourceCta']
          assert ui['fontScale'] == 1.5 and ui['shortDisplay'] == [900,1600]
          assert {g['provider'] for g in ui['groups']} == {'Brickwise','Reental'}
          assert all(g['references'] >= 2 and g['returned'] for g in ui['groups'])
          assert {c['title'] for c in ui['costs']} == {'mF-ONE','mGLO'}
          assert all(c['bothConceptsObserved'] and c['valuesWereNotAdded'] and c['success'] == '0%' for c in ui['costs'])
          assert ui['orientation']['policy'] == os.environ['ORIENTATION_POLICY']
          assert result['landscapeTested'] == (os.environ['ORIENTATION_POLICY'] == 'default')
          assert result['talkBackTested'] is False and ui['talkback']['tested'] is False
          assert result['dailyCatalogExpansionOnDeviceTested'] is False
          assert result['spikoDocumentaryDetail'] and result['academyLessons'] == 7
          assert result['tabs'] == ['Inicio', 'Buscar', 'Academy', 'Perfil']
          assert result['accountForms'] == ['login', 'signup', 'recovery', 'confirmation']
          assert result['editorialPhotoAccessibility'] is True
          assert result['editorialPhotoSlugs'] == ["spiko-letras-del-tesoro-euro","casa-de-outeiro","prosegur-digital-gold","fotovoltaica-greenpoint","reental-secundario-houston-3"]
          assert result['editorialVisualReviewCompleted'] is False, 'QA itself cannot claim visual review'
          assert result['emptyLoginValidation'] and result['passwordInputsMasked']
          assert result['accountPanelNoteSeparated'] and result['accountPanelNoteGapPixels'] >= 40
          assert result['credentialsEntered'] is False and result['termsAccepted'] is False
          assert result['authEndToEndTested'] is False and result['smtpTested'] is False and result['physicalDevice'] is False
          pathlib.Path('rwadar-android-140-evidence.zip').write_bytes(payload)
          PY
          printf '%s  rwadar-android-140-evidence.zip\n' "$EVIDENCE_SHA256" >> SHA256SUMS.txt
      - name: Create a new draft without replacing any existing release
        shell: bash
        run: |
          set -euo pipefail
          # Read-only baseline: creating v1.4.0 must never edit/delete v1.3.2.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.3.2" > previous-132.json
          python3 - <<'PY'
          import json, pathlib
          release = json.loads(pathlib.Path('previous-132.json').read_text())
          assert release['tag_name'] == 'v1.3.2' and not release['draft'] and not release['prerelease']
          assert {a['name'] for a in release['assets']} == {'RWAdar.apk','SHA256SUMS.txt','rwadar-android-132-evidence.zip'}
          apk = next(a for a in release['assets'] if a['name'] == 'RWAdar.apk')
          assert apk['size'] == 88777561
          if apk.get('digest') is not None:
              assert apk['digest'] == 'sha256:998d0aed3b183b8f045c36e2772421da806e0e0996e5513de8549ccc13f3fdf9'
          PY
          # Any existing tag release or ambiguous API response stops publication.
          status="$(curl --silent --show-error --proto '=https' --max-time 30 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output existing-release.json --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          test "$status" = 404
          python3 - <<'PY'
          import os, pathlib
          note = f"""RWAdar 1.4.0 · Android (versionCode 18)

          Interfaz en español e inglés, con elección de idioma conservada al reiniciar.
          Los nombres, cifras y documentos originales mantienen su idioma y su fuente.
          Fichas con título completo y controles persistentes; tarjetas con mínimo
          documentado en euros, acceso desde España y condiciones de salida, o su
          incertidumbre explícita. Consulta de fuente, revisión y fecha del dato
          aparecen separadas. Las referencias repetidas se agrupan por proveedor.
          Las nuevas referencias completas del catálogo y sus ilustraciones pueden
          llegar sin recompilar: se mantienen límites y controles de integridad.
          Las imágenes son ilustraciones editoriales; no son fotografías del activo real.
          Las capturas del APK exacto y sus veinte puntos se revisaron antes de publicar.
          La validación conserva fases comprobadas de la ejecución 39812931682,
          que terminó con fallo de guion; su ZIP y sus capturas quedan identificados
          e intactos. Una continuación separada completa solo los criterios pendientes.

          Catálogo público sin registro obligatorio, con conteos visibles por colección.
          Cuentas gratuitas y opcionales, compartidas con la web. La confirmación y
          recuperación por correo se abren en la web; después vuelve a entrar en la app.
          Sesión solo en memoria. Favoritos y Academy permanecen en el dispositivo.
          Publicidad, cobros y avisos push siguen desactivados.

          SHA-256 del APK: {os.environ['APK_SHA256']}
          Certificado SHA-256: {os.environ['CERT_SHA256']}
          Tamaño: {os.environ['APK_BYTES']} bytes.
          Fuente privada revisada: {os.environ['SOURCE_HEAD_SHA']}
          Compilación EAS: {os.environ['EAS_BUILD_ID']}
          Verificación del APK exacto en emulador Android API35:
          https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['QA_RUN_ID']}

          Alcance: instalación, arranque, catálogo, navegación, favorito local persistente
          y formularios de cuentas sin credenciales, cinco ilustraciones muestreadas,
          grupos, lectura completa del detalle y fuente ampliada en pantalla corta.
          Política de orientación: {os.environ['ORIENTATION_POLICY']}.
          No acredita TalkBack, creación/inicio de sesión real, SMTP, recuperación
          efectiva, una oferta nueva real en el dispositivo ni un teléfono físico.
          """
          pathlib.Path('release-notes.txt').write_text(note, encoding='utf-8')
          PY
          gh release create "$RELEASE_TAG" RWAdar.apk SHA256SUMS.txt rwadar-android-140-evidence.zip \
            --repo "$GITHUB_REPOSITORY" --target "$QA_HEAD_SHA" \
            --title 'RWAdar 1.4.0 · Android' --notes-file release-notes.txt --draft --latest=false
      - name: Verify the uploaded draft assets before making them public
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > draft-metadata.json
          python3 - <<'PY'
          import json, os, pathlib
          release = json.loads(pathlib.Path('draft-metadata.json').read_text())
          assert release['tagName'] == 'v1.4.0' and release['isDraft'] is True
          assert release['isPrerelease'] is False
          assets = {asset['name']: asset for asset in release['assets']}
          assert set(assets) == {'RWAdar.apk', 'SHA256SUMS.txt', 'rwadar-android-140-evidence.zip'}
          assert assets['RWAdar.apk']['size'] == int(os.environ['APK_BYTES'])
          assert assets['rwadar-android-140-evidence.zip']['size'] == int(os.environ['EVIDENCE_BYTES'])
          PY
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir release-readback --pattern RWAdar.apk --pattern SHA256SUMS.txt --pattern rwadar-android-140-evidence.zip
          test "$(stat -c '%s' release-readback/RWAdar.apk)" = "$APK_BYTES"
          printf '%s  release-readback/RWAdar.apk\n' "$APK_SHA256" | sha256sum --check
          cmp SHA256SUMS.txt release-readback/SHA256SUMS.txt
          test "$(stat -c '%s' release-readback/rwadar-android-140-evidence.zip)" = "$EVIDENCE_BYTES"
          printf '%s  release-readback/rwadar-android-140-evidence.zip\n' "$EVIDENCE_SHA256" | sha256sum --check
          # From this line onward publication is the explicit authorised action.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=true
      - name: Verify anonymous public release and permanent download links
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --proto '=https' --max-time 30 --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" -o public-release.json
          python3 - <<'PY'
          import json, os, pathlib
          release = json.loads(pathlib.Path('public-release.json').read_text())
          assert release['tag_name'] == 'v1.4.0' and not release['draft'] and not release['prerelease']
          assets = {asset['name']: asset for asset in release['assets']}
          assert set(assets) == {'RWAdar.apk', 'SHA256SUMS.txt', 'rwadar-android-140-evidence.zip'}
          assert assets['RWAdar.apk']['size'] == int(os.environ['APK_BYTES'])
          assert assets['rwadar-android-140-evidence.zip']['size'] == int(os.environ['EVIDENCE_BYTES'])
          PY
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 180 --retry 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/RWAdar.apk" -o public-readback.apk
          test "$(stat -c '%s' public-readback.apk)" = "$APK_BYTES"
          printf '%s  public-readback.apk\n' "$APK_SHA256" | sha256sum --check
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --retry 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/rwadar-android-140-evidence.zip" -o public-evidence.zip
          test "$(stat -c '%s' public-evidence.zip)" = "$EVIDENCE_BYTES"
          printf '%s  public-evidence.zip\n' "$EVIDENCE_SHA256" | sha256sum --check
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.3.2" > previous-132-after.json
          python3 - <<'PY'
          import json, pathlib
          def identity(file):
              r = json.loads(pathlib.Path(file).read_text())
              return {k:r[k] for k in ('id','tag_name','draft','prerelease','published_at')} | {
                  'assets':sorted((a['id'],a['name'],a['size'],a.get('digest')) for a in r['assets'])}
          assert identity('previous-132.json') == identity('previous-132-after.json'), 'v1.3.2 identity changed'
          PY
          printf 'Public verified release: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$RELEASE_TAG"
