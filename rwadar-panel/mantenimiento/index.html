<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RWAdar · En mantenimiento</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0B0A0A;color:#F7F5F0;
font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:30rem;text-align:center}
.marca{font-weight:700;letter-spacing:-.02em;font-size:1.1rem;margin-bottom:2.5rem}
.marca b{color:#25E39A}
.pulso{width:12px;height:12px;border-radius:50%;background:#25E39A;margin:0 auto 1.5rem;
box-shadow:0 0 0 0 rgba(37,227,154,.5);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 18px rgba(37,227,154,0)}100%{box-shadow:0 0 0 0 rgba(37,227,154,0)}}
h1{font-size:1.75rem;line-height:1.2;margin-bottom:.75rem}
p{color:#BBB5AB}
.en{margin-top:1.5rem;font-size:.9rem;color:#8A8378}
@media (prefers-reduced-motion:reduce){.pulso{animation:none}}
</style></head>
<body><main>
<div class="marca">RW<b>A</b>dar</div>
<div class="pulso" aria-hidden="true"></div>
<h1>Estamos haciendo mantenimiento</h1>
<p>RWAdar vuelve enseguida. Gracias por la paciencia.</p>
<p class="en" lang="en">RWAdar is down for maintenance and will be back shortly.</p>
</main></body></html>
